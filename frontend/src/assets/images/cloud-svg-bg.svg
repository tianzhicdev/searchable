<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#89CFF0"/>
      <stop offset="15%" stop-color="#7EC8E3"/>
      <stop offset="40%" stop-color="#A8DAEA"/>
      <stop offset="60%" stop-color="#B5E0F0"/>
      <stop offset="80%" stop-color="#C2E6F5"/>
      <stop offset="100%" stop-color="#D0ECFA"/>
    </linearGradient>

    <radialGradient id="purpleTL" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#C9A0DC" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#B48AD8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B48AD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleBR" cx="100%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#C9A0DC" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#B48AD8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B48AD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleBL" cx="0%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#D4A0E0" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#C090D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C090D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleR" cx="100%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C9A0DC" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#B48AD8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B48AD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleL" cx="0%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#D4A0E0" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#C090D0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C090D0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mintTR" cx="100%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#A8F0C8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#90E8B8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#90E8B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintBL" cx="0%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#A8F0C8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#90E8B8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#90E8B8" stop-opacity="0"/>
    </radialGradient>

    <filter id="f3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="f5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="f8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="f12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="f20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="f35"><feGaussianBlur stdDeviation="35"/></filter>
